name: CI

# Runs on PRs to main and pushes to feature branches. Pushes to main run this
# same workflow via deploy.yml (workflow_call), so deploy is gated on it in a
# single run — no workflow_run, no cross-workflow token juggling.
on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '22.23.5'

jobs:
  quality:
    name: Lint, typecheck, format, unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run test:unit

  e2e:
    name: Playwright e2e
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    container:
      # Official Playwright image, pinned by digest (matches @playwright/test 1.65.1).
      image: mcr.microsoft.com/playwright:v1.65.1-noble@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579
      options: --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Run Playwright tests
        run: npx playwright test --reporter=html,list
        env:
          CI: 'true'
          HOME: /root
      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - name: Upload screenshots + traces (evidence)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-evidence
          path: test-results/
          retention-days: 7

  audit:
    name: npm audit (high+)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # pull-requests: write is used only to post the audit summary as a PR
    # comment. This job never runs `npm ci`, so no dependency code executes here.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: npm audit
        id: audit
        shell: bash
        run: |
          set +e
          npm audit --audit-level=high > audit.txt 2>&1
          status=$?
          set -e
          cat audit.txt
          {
            echo '### npm audit (--audit-level=high)'
            echo
            if [ "$status" -eq 0 ]; then echo '✅ No high or critical vulnerabilities.'; else echo '❌ High/critical vulnerabilities found.'; fi
            echo
            echo '```'
            tail -n 40 audit.txt
            echo '```'
          } > audit-summary.md
          cat audit-summary.md >> "$GITHUB_STEP_SUMMARY"
          echo "status=$status" >> "$GITHUB_OUTPUT"
      - name: Comment audit result on PR
        # Same-repo PRs only: fork PRs get a read-only token.
        if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const body = '<!-- npm-audit -->\n' + fs.readFileSync('audit-summary.md', 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.body && c.body.startsWith('<!-- npm-audit -->'));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
      - name: Fail on high/critical vulnerabilities
        if: ${{ steps.audit.outputs.status != '0' }}
        run: exit 1
